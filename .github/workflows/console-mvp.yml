name: Validate RStudio console MVP

on:
  workflow_dispatch:
  push:
    branches: [rstudio-console-mvp-20261106]
    paths: ['console/**', 'scripts/console.R', 'tools/transcriptomeconsole/**', 'tests/console/**', 'tests/run_console_tests.R', '.github/workflows/console-mvp.yml']
  pull_request:
    paths: ['console/**', 'scripts/console.R', 'tools/transcriptomeconsole/**', 'tests/console/**', 'tests/run_console_tests.R', '.github/workflows/console-mvp.yml']

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true
      - name: Install console test dependencies
        shell: Rscript {0}
        run: |
          install.packages(c('shiny', 'callr', 'yaml', 'filelock', 'digest', 'data.table', 'tibble', 'dplyr', 'targets', 'testthat', 'rstudioapi'))
      - name: Test console lifecycle and targets integration
        run: Rscript tests/run_console_tests.R
      - name: Install Addin entry package
        run: R CMD INSTALL tools/transcriptomeconsole
