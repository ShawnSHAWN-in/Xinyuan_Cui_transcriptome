name: Validate RStudio console MVP

on:
  workflow_dispatch:
  push:
    branches: [rstudio-console-mvp-20261106]
    paths: ['console/**', 'R/runtime.R', '_targets.R', 'scripts/console.R', 'tools/transcriptomeconsole/**', 'tests/console/**', 'tests/run_console_tests.R', '.github/workflows/console-mvp.yml']
  pull_request:
    paths: ['console/**', 'R/runtime.R', '_targets.R', 'scripts/console.R', 'tools/transcriptomeconsole/**', 'tests/console/**', 'tests/run_console_tests.R', '.github/workflows/console-mvp.yml']

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install igraph system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk40 libxml2-dev
      - name: Install console test dependencies
        shell: Rscript {0}
        run: |
          install.packages(c('shiny', 'callr', 'yaml', 'filelock', 'digest', 'data.table', 'tibble', 'dplyr', 'targets', 'testthat', 'rstudioapi', 'crew', 'parallelly', 'visNetwork'))
          loadNamespace('targets')
          sessionInfo()
      - name: Test console lifecycle and targets integration
        run: Rscript tests/run_console_tests.R
      - name: Install Addin entry package
        run: R CMD INSTALL tools/transcriptomeconsole
